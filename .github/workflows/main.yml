name: Build K230 Debian 13 Image for LushanPi (Big Core)

on:
  workflow_dispatch:
    inputs:
      sdk_branch:
        description: 'K230 Linux SDK branch to use'
        required: false
        default: 'main'
        type: string
      defconfig:
        description: 'Board defconfig (LushanPi K230)'
        required: false
        default: 'k230_canmv_lckfb_defconfig'
        type: string
      debian_mirror:
        description: 'Debian mirror URL'
        required: false
        default: 'https://mirrors.aliyun.com/debian/'
        type: string
      image_version:
        description: 'Custom image version tag'
        required: false
        default: 'v0.1.0'
        type: string
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-debian13.yml'
  pull_request:
    branches: [ main, master ]

env:
  DEBIAN_FRONTEND: noninteractive
  SDK_REPO: https://github.com/kendryte/k230_linux_sdk.git
  # 固定容器内的构建根目录，避免依赖容器内 $(pwd) 能否解析
  BUILD_ROOT: /build
  # 官方明确禁止并行编译（-j），SDK 内部并发会出诡异错误
  MAKEFLAGS: -j1
  # 工具链缓存目录（容器内挂载点）
  TOOLCHAIN_DIR: /opt/toolchain

jobs:
  # ============================================================================
  # Job 1: Build Debian 13 Root Filesystem (debootstrap)
  # ============================================================================
  build-rootfs:
    runs-on: ubuntu-24.04
    outputs:
      rootfs_hash: ${{ steps.hash.outputs.hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies for debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static \
            binfmt-support \
            debootstrap \
            debian-archive-keyring \
            systemd-container \
            rsync \
            wget \
            ca-certificates \
            git \
            cpio \
            xz-utils

      - name: Verify riscv64 binfmt support
        run: |
          echo ">>> Checking riscv64 binfmt support..."
          if ls /proc/sys/fs/binfmt_misc/qemu-riscv64 >/dev/null 2>&1; then
            echo "✅ qemu-riscv64 binfmt already registered"
            cat /proc/sys/fs/binfmt_misc/qemu-riscv64
          else
            echo "⚠️ qemu-riscv64 binfmt not found, checking if it can run anyway..."
            qemu-riscv64-static --version || true
          fi

      - name: Download latest debootstrap (for trixie support)
        run: |
          echo ">>> Checking debootstrap version..."
          dpkg -l debootstrap | tail -1

          if [ ! -f /usr/share/debootstrap/scripts/trixie ]; then
            echo ">>> Downloading trixie script..."
            sudo wget -q -O /usr/share/debootstrap/scripts/trixie \
              https://raw.githubusercontent.com/debian-archive/debootstrap/master/scripts/trixie
          fi
          ls -la /usr/share/debootstrap/scripts/trixie

      - name: Create Debian 13 (trixie) rootfs via debootstrap
        run: |
          set -e
          ROOTFS_DIR="${{ github.workspace }}/debian13"

          sudo rm -rf "${ROOTFS_DIR}"

          echo ">>> Bootstrapping Debian 13 (trixie) rootfs for riscv64..."
          sudo debootstrap \
            --arch=riscv64 \
            --keyring=/usr/share/keyrings/debian-archive-keyring.gpg \
            --foreign \
            trixie \
            "${ROOTFS_DIR}" \
            "${{ inputs.debian_mirror || 'https://mirrors.aliyun.com/debian/' }}"

          echo ">>> Copying qemu-riscv64-static for second stage..."
          sudo mkdir -p "${ROOTFS_DIR}/usr/bin"
          sudo cp /usr/bin/qemu-riscv64-static "${ROOTFS_DIR}/usr/bin/"
          sudo chmod +x "${ROOTFS_DIR}/usr/bin/qemu-riscv64-static"

          echo ">>> Running debootstrap second stage..."
          sudo chroot "${ROOTFS_DIR}" /debootstrap/debootstrap --second-stage

          echo ">>> Rootfs bootstrap complete!"

      - name: Configure rootfs (apt sources, hostname, network, users)
        run: |
          set -e
          ROOTFS_DIR="${{ github.workspace }}/debian13"

          cat <<'EOF' | sudo tee "${ROOTFS_DIR}/etc/apt/sources.list.d/debian.sources"
          Types: deb
          URIs: http://mirrors.aliyun.com/debian/
          Suites: trixie trixie-updates trixie-backports
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

          Types: deb
          URIs: http://security.debian.org/debian-security
          Suites: trixie-security
          Components: main contrib non-free non-free-firmware
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF

          sudo rm -f "${ROOTFS_DIR}/etc/apt/sources.list"

          echo "k230-lushanpi" | sudo tee "${ROOTFS_DIR}/etc/hostname"
          cat <<'EOF' | sudo tee "${ROOTFS_DIR}/etc/hosts"
          127.0.0.1   localhost
          127.0.1.1   k230-lushanpi
          ::1         localhost ip6-localhost ip6-loopback
          EOF

          echo "Asia/Shanghai" | sudo tee "${ROOTFS_DIR}/etc/timezone"
          sudo chroot "${ROOTFS_DIR}" ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime 2>/dev/null || true

          cat <<'EOF' | sudo tee "${ROOTFS_DIR}/etc/fstab"
          # <file system>  <mount point>  <type>  <options>  <dump>  <pass>
          /dev/mmcblk1p5   /              ext4    defaults,noatime  0  1
          proc             /proc          proc    defaults          0  0
          sysfs            /sys           sysfs   defaults          0  0
          devpts           /dev/pts       devpts  defaults          0  0
          tmpfs            /tmp           tmpfs   defaults          0  0
          tmpfs            /var/log       tmpfs   defaults,size=64M 0  0
          EOF

          sudo chroot "${ROOTFS_DIR}" bash -c 'echo "root:root" | chpasswd'

          sudo mkdir -p "${ROOTFS_DIR}/etc/systemd/system/serial-getty@ttyS0.service.d"
          cat <<'EOF' | sudo tee "${ROOTFS_DIR}/etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf"
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I 115200 linux
          EOF

          cat <<'CHROOT_SCRIPT' | sudo tee "${ROOTFS_DIR}/chroot_setup.sh"
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export LC_ALL=C

          mount -t proc none /proc 2>/dev/null || true
          mount -t sysfs none /sys 2>/dev/null || true
          mount -t devpts devpts /dev/pts 2>/dev/null || true

          apt-get update || true
          apt-get upgrade -y || true

          apt-get install -y --no-install-recommends \
            systemd \
            systemd-sysv \
            udev \
            dhcpcd5 \
            net-tools \
            iputils-ping \
            wpasupplicant \
            wireless-tools \
            iw \
            openssh-server \
            openssh-client \
            sudo \
            ca-certificates \
            wget \
            curl \
            vim \
            nano \
            less \
            htop \
            rsync \
            parted \
            dosfstools \
            e2fsprogs \
            fdisk \
            gpiod \
            python3 \
            python3-pip \
            python3-venv \
            usbutils \
            pciutils \
            kmod \
            || true

          sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true

          systemctl enable systemd-networkd 2>/dev/null || true
          systemctl enable systemd-resolved 2>/dev/null || true

          mkdir -p /etc/systemd/network
          cat > /etc/systemd/network/eth0.network <<'NETEOF'
          [Match]
          Name=eth0

          [Network]
          DHCP=yes
          NETEOF

          apt-get clean
          rm -rf /var/lib/apt/lists/*

          umount /proc 2>/dev/null || true
          umount /sys 2>/dev/null || true
          umount /dev/pts 2>/dev/null || true

          echo "Chroot setup complete!"
          CHROOT_SCRIPT

          sudo chmod +x "${ROOTFS_DIR}/chroot_setup.sh"

          echo ">>> Running chroot package installation..."
          sudo chroot "${ROOTFS_DIR}" /chroot_setup.sh || {
            echo "Chroot script failed, but continuing..."
          }

          sudo rm -f "${ROOTFS_DIR}/chroot_setup.sh"
          sudo rm -f "${ROOTFS_DIR}/usr/bin/qemu-riscv64-static"

      - name: Generate rootfs ext4 image
        run: |
          set -e
          ROOTFS_DIR="${{ github.workspace }}/debian13"
          OUTPUT_DIR="${{ github.workspace }}/output"
          mkdir -p "${OUTPUT_DIR}"

          ROOTFS_SIZE="1536M"
          ROOTFS_IMG="${OUTPUT_DIR}/debian13_rootfs.ext4"

          echo ">>> Creating ext4 image: ${ROOTFS_IMG} (${ROOTFS_SIZE})"
          sudo mkfs.ext4 -d "${ROOTFS_DIR}" -r 1 -N 0 -m 1 -L "rootfs" -O ^64bit "${ROOTFS_IMG}" "${ROOTFS_SIZE}"

          echo ">>> Compressing rootfs..."
          cd "${OUTPUT_DIR}"
          tar -czvf "debian13_rootfs.ext4.tar.gz" "debian13_rootfs.ext4"

          sha256sum "debian13_rootfs.ext4" > "debian13_rootfs.ext4.sha256"
          sha256sum "debian13_rootfs.ext4.tar.gz" > "debian13_rootfs.ext4.tar.gz.sha256"

          ls -lh "${OUTPUT_DIR}/"

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian13-rootfs
          path: |
            output/debian13_rootfs.ext4
            output/debian13_rootfs.ext4.tar.gz
            output/debian13_rootfs.ext4.sha256
            output/debian13_rootfs.ext4.tar.gz.sha256
          retention-days: 30

      - name: Generate rootfs hash
        id: hash
        run: |
          HASH=$(sha256sum output/debian13_rootfs.ext4 | awk '{print $1}')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Rootfs SHA256: ${HASH}"

  # ============================================================================
  # Job 2: Build K230 SDK (kernel, uboot, opensbi) using Docker
  # ============================================================================
  build-sdk:
    runs-on: ubuntu-24.04
    needs: build-rootfs
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone K230 Linux SDK
        run: |
          SDK_BRANCH="${{ inputs.sdk_branch || 'main' }}"
          echo ">>> Cloning K230 Linux SDK (branch: ${SDK_BRANCH})..."
          git clone --depth=1 -b "${SDK_BRANCH}" "${SDK_REPO}" k230_sdk
          ls -la k230_sdk/

      - name: Setup Docker
        run: |
          if ! command -v docker &> /dev/null; then
            echo ">>> Docker not found, installing..."
            sudo apt-get update
            sudo apt-get install -y docker.io
          else
            echo ">>> Docker already installed:"
            docker --version
          fi

          if ! sudo systemctl is-active --quiet docker; then
            sudo systemctl start docker
          fi

          sudo usermod -aG docker $USER || true

          sudo docker --version
          sudo docker info --format '{{.ServerVersion}}' || true

      - name: Patch Dockerfile to use Aliyun mirror (fix 403 from tuna)
        run: |
          cd k230_sdk
          echo ">>> Checking Dockerfile mirror settings..."
          echo "--- Current sources.list lines in Dockerfile ---"
          grep -n "mirrors\.\|sources\.list" tools/docker/Dockerfile || echo "(no mirror sed found)"

          # 清华源/中科大源对境外 IP 返回 403 Forbidden，GitHub Actions runner 在境外
          # 必须替换为阿里云（对境外 IP 无限制）
          echo ">>> Patching Dockerfile: tuna/ustc -> aliyun..."
          # 处理各种可能的写法：tuna、ustc、tsinghua
          sed -i 's|mirrors.tuna.tsinghua.edu.cn|mirrors.aliyun.com|g' tools/docker/Dockerfile
          sed -i 's|mirrors.ustc.edu.cn|mirrors.aliyun.com|g' tools/docker/Dockerfile
          sed -i 's|archive.ubuntu.com|mirrors.aliyun.com|g' tools/docker/Dockerfile
          sed -i 's|security.ubuntu.com|mirrors.aliyun.com|g' tools/docker/Dockerfile

          echo "--- Patched Dockerfile ---"
          grep -n "mirrors\.\|sources\.list\|apt-get" tools/docker/Dockerfile || echo "(check above)"

      - name: Build SDK Docker image
        run: |
          cd k230_sdk
          echo ">>> Building K230 SDK Docker image (with aliyun mirror)..."

          # 境外 runner 拉取 Docker Hub 基础镜像可能慢，加长 pull 超时
          sudo docker build \
            --network=host \
            -f tools/docker/Dockerfile \
            -t k230_builder \
            tools/docker

          echo ">>> Docker image built successfully:"
          sudo docker images k230_builder

      # ---- 关键修复 1：Docker 挂载改为固定 /build，不再依赖容器内 $(pwd) ----
      # ---- 关键修复 2：每个 docker run 加 set -ex，让容器内真实输出可见 ----
      - name: Prepare SDK source code inside Docker
        run: |
          SDK_DIR="${{ github.workspace }}/k230_sdk"
          echo ">>> Preparing source code..."
          echo "Host SDK dir: ${SDK_DIR}"
          echo "Contents:"
          ls -la "${SDK_DIR}/"
          echo "--- tools/ ---"
          ls -la "${SDK_DIR}/tools/" | head -30
          echo "--- get_download_url.sh ---"
          head -20 "${SDK_DIR}/tools/get_download_url.sh" || echo "(file not found)"

          sudo docker run --rm \
            -u root \
            -v "${SDK_DIR}:${BUILD_ROOT}" \
            -w "${BUILD_ROOT}" \
            -e DEBIAN_FRONTEND=noninteractive \
            k230_builder \
            bash -c 'set -ex
              echo "=== container pwd ==="
              pwd
              echo "=== container ls ==="
              ls -la
              echo "=== sourcing get_download_url.sh ==="
              source tools/get_download_url.sh
              echo "=== get_download_url.sh sourced OK ==="

              # 境外 runner 下载 SDK 源码包不稳定，失败自动重试 3 次
              echo "=== starting make prepare_sourcecode (with retry) ==="
              for i in 1 2 3; do
                echo "--- attempt $i/3 ---"
                if make prepare_sourcecode; then
                  echo "=== make prepare_sourcecode succeeded on attempt $i ==="
                  break
                fi
                echo "--- attempt $i failed, waiting 30s before retry ---"
                sleep 30
                if [ "$i" = "3" ]; then
                  echo "=== make prepare_sourcecode FAILED after 3 attempts ==="
                  exit 1
                fi
              done
            '

          echo ">>> After prepare_sourcecode, host view:"
          ls -la "${SDK_DIR}/" | head -40

      - name: Configure SDK for LushanPi K230
        run: |
          SDK_DIR="${{ github.workspace }}/k230_sdk"
          DEFCONFIG="${{ inputs.defconfig || 'k230_canmv_lckfb_defconfig' }}"
          echo ">>> Configuring SDK with: ${DEFCONFIG}"
          echo "Host SDK dir: ${SDK_DIR}"

          # 检查 defconfig 文件是否存在（SDK 仓库内 configs/ 目录）
          echo "--- Looking for ${DEFCONFIG} in SDK ---"
          find "${SDK_DIR}" -name "${DEFCONFIG}" -not -path "*/output/*" 2>/dev/null | head -5
          ls -la "${SDK_DIR}/configs/" 2>/dev/null | grep -i "${DEFCONFIG}" || echo "(not found in configs/)"

          sudo docker run --rm \
            -u root \
            -v "${SDK_DIR}:${BUILD_ROOT}" \
            -v "${SDK_DIR}/toolchain:${TOOLCHAIN_DIR}" \
            -w "${BUILD_ROOT}" \
            -e DEBIAN_FRONTEND=noninteractive \
            k230_builder \
            bash -c 'set -ex
              echo "=== container pwd ==="
              pwd
              echo "=== make CONF=${DEFCONFIG} ==="
              make CONF=${DEFCONFIG}
              echo "=== make CONF exit code: $? ==="
              echo "=== output after CONF ==="
              ls -la output/ 2>/dev/null || echo "(output/ missing)"
            '

          echo ">>> After configure, host view of output/:"
          ls -la "${SDK_DIR}/output/" 2>/dev/null || echo "(output/ does not exist)"
          if [ -d "${SDK_DIR}/output/${DEFCONFIG}" ]; then
            ls -la "${SDK_DIR}/output/${DEFCONFIG}/"
          else
            echo "❌ output/${DEFCONFIG}/ still missing after configure!"
            echo "--- full output/ tree ---"
            find "${SDK_DIR}/output" -maxdepth 3 2>/dev/null | sort || echo "(empty)"
          fi

      # ---- 关键修复 3：去掉 -j$(nproc)，SDK 内部并行会出问题 ----
      - name: Build SDK (kernel, uboot, opensbi)
        run: |
          SDK_DIR="${{ github.workspace }}/k230_sdk"
          echo ">>> Building SDK (single job, no -j)..."
          echo "Host SDK dir: ${SDK_DIR}"

          sudo docker run --rm \
            -u root \
            -v "${SDK_DIR}:${BUILD_ROOT}" \
            -v "${SDK_DIR}/toolchain:${TOOLCHAIN_DIR}" \
            -w "${BUILD_ROOT}" \
            k230_builder \
            bash -c 'set -ex
              echo "=== container pwd ==="
              pwd
              echo "=== make (no -j, single job) ==="
              make
              echo "=== make exit code: $? ==="
            '

          echo ">>> After build, host view:"
          ls -la "${SDK_DIR}/output/${DEFCONFIG}/" 2>/dev/null || echo "(DEFCONFIG dir missing)"
          ls -la "${SDK_DIR}/output/${DEFCONFIG}/images/" 2>/dev/null || echo "(images/ dir missing)"

      # ---- 关键修复 4：解压前先检查目录和文件，给明确错误信息 ----
      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: debian13-rootfs
          path: k230_sdk/output/rootfs_artifact

      - name: Verify rootfs artifact
        run: |
          set -e
          ARTIFACT_DIR="${{ github.workspace }}/k230_sdk/output/rootfs_artifact"
          echo ">>> Verifying downloaded rootfs artifact..."
          ls -lh "${ARTIFACT_DIR}/"

          if [ ! -f "${ARTIFACT_DIR}/debian13_rootfs.ext4.tar.gz" ]; then
            echo "❌ debian13_rootfs.ext4.tar.gz not found in artifact!"
            exit 1
          fi

          echo ">>> Verifying tarball integrity..."
          tar -tzf "${ARTIFACT_DIR}/debian13_rootfs.ext4.tar.gz" | head -5
          echo "✅ tarball OK"

      - name: Verify SDK build output
        run: |
          set -e
          cd k230_sdk
          DEFCONFIG="${{ inputs.defconfig || 'k230_canmv_lckfb_defconfig' }}"

          echo ">>> Verifying SDK build actually produced output..."
          echo "--- Full output/ tree ---"
          find output/ -maxdepth 3 -type d 2>/dev/null | sort || echo "(output/ empty or missing)"

          echo ""
          echo "--- output/${DEFCONFIG}/ contents ---"
          ls -la "output/${DEFCONFIG}/" 2>/dev/null || echo "❌ output/${DEFCONFIG}/ MISSING"

          echo ""
          echo "--- any defconfig output dirs? ---"
          ls -d output/*/ 2>/dev/null || echo "(none)"

          echo ""
          echo "--- toolchain/ dir ---"
          ls -la toolchain/ 2>/dev/null | head -10 || echo "(toolchain/ missing)"

          if [ ! -d "output/${DEFCONFIG}" ]; then
            echo ""
            echo "❌ FATAL: output/${DEFCONFIG}/ does not exist"
            echo "This means 'make prepare_sourcecode' / 'make CONF=${DEFCONFIG}' did not run or did not succeed."
            echo "Check the 'Prepare SDK source code' and 'Configure SDK' steps above for errors."
            exit 1
          fi

          if [ ! -d "output/${DEFCONFIG}/images" ]; then
            echo ""
            echo "❌ FATAL: output/${DEFCONFIG}/images/ does not exist"
            echo "This means 'make' (build) did not produce kernel/uboot images."
            echo "Check the 'Build SDK' step above for errors."
            exit 1
          fi

          echo "✅ SDK build output verified"

      - name: Replace rootfs and configure for Big Core Debian boot
        run: |
          set -e
          cd k230_sdk
          DEFCONFIG="${{ inputs.defconfig || 'k230_canmv_lckfb_defconfig' }}"
          IMAGES_DIR="output/${DEFCONFIG}/images"

          echo "✅ ${IMAGES_DIR} exists (verified in previous step)"
          ls -lh "${IMAGES_DIR}/"

          echo ">>> Replacing rootfs with Debian 13..."
          tar -xvf "output/rootfs_artifact/debian13_rootfs.ext4.tar.gz" -C "${IMAGES_DIR}/"
          ls -lh "${IMAGES_DIR}/"

          echo ">>> Patching genimage-sdcard.cfg for Debian rootfs..."
          GENIMAGE_CFG="board/common/gen_image_cfg/genimage-sdcard.cfg"
          if [ ! -f "${GENIMAGE_CFG}" ]; then
            echo "❌ ${GENIMAGE_CFG} not found!"
            echo "Looking for genimage configs:"
            find board/ -name "*genimage*" 2>/dev/null || echo "(none found)"
            exit 1
          fi

          if grep -q "partition debian" "${GENIMAGE_CFG}" 2>/dev/null; then
            echo "Debian partition already configured."
          else
            cat >> "${GENIMAGE_CFG}" <<'EOF'

            partition debian {
                image = "debian13_rootfs.ext4"
            }
            EOF
          fi

          echo ">>> Patching default.env bootcmd for Big Core..."
          DEFAULT_ENV="board/common/env/default.env"
          if [ ! -f "${DEFAULT_ENV}" ]; then
            echo "❌ ${DEFAULT_ENV} not found!"
            find board/ -name "default.env" 2>/dev/null || echo "(none found)"
            exit 1
          fi

          echo "--- default.env before patch ---"
          grep "^bootcmd=" "${DEFAULT_ENV}" || echo "(no bootcmd= line found)"

          sed -i 's|^bootcmd=.*|bootcmd=setenv bootargs "root=/dev/mmcblk1p5 loglevel=8 rw rootdelay=4 rootfstype=ext4 console=ttyS0,115200 earlycon=sbi";k230_boot auto auto_boot;|' "${DEFAULT_ENV}"

          echo ">>> Patched files:"
          echo "--- genimage-sdcard.cfg (last 15 lines) ---"
          tail -15 "${GENIMAGE_CFG}"
          echo "--- default.env ---"
          grep "^bootcmd=" "${DEFAULT_ENV}"

      - name: Build final SD card image
        run: |
          set -e
          SDK_DIR="${{ github.workspace }}/k230_sdk"
          DEFCONFIG="${{ inputs.defconfig || 'k230_canmv_lckfb_defconfig' }}"
          echo ">>> Building final SD card image..."

          sudo docker run --rm \
            -u root \
            -v "${SDK_DIR}:${BUILD_ROOT}" \
            -v "${SDK_DIR}/toolchain:${TOOLCHAIN_DIR}" \
            -w "${BUILD_ROOT}" \
            -e DEBIAN_FRONTEND=noninteractive \
            k230_builder \
            bash -c 'set -ex
              echo "=== make build-image ==="
              make build-image
              echo "=== make build-image exit code: $? ==="
              echo "=== images after build-image ==="
              ls -lh output/'${DEFCONFIG}'/images/ 2>/dev/null || echo "(images/ missing)"
            '

          echo ">>> Build complete! Output files:"
          ls -lh "k230_sdk/output/${DEFCONFIG}/images/"

          if [ ! -f "k230_sdk/output/${DEFCONFIG}/images/sysimage-sdcard.img" ]; then
            echo "❌ sysimage-sdcard.img was not generated!"
            ls -la "k230_sdk/output/${DEFCONFIG}/images/" || true
            exit 1
          fi
          echo "✅ sysimage-sdcard.img generated successfully"

      - name: Rename and compress final image
        run: |
          set -e
          cd k230_sdk
          DEFCONFIG="${{ inputs.defconfig || 'k230_canmv_lckfb_defconfig' }}"
          IMAGES_DIR="output/${DEFCONFIG}/images"
          VERSION="${{ inputs.image_version || 'v0.1.0' }}"
          DATE=$(date +%Y%m%d)

          IMG_FILE=$(find "${IMAGES_DIR}" -name "sysimage-sdcard.img" | head -1)
          if [ -z "${IMG_FILE}" ]; then
            echo "ERROR: sysimage-sdcard.img not found!"
            echo "Contents of ${IMAGES_DIR}:"
            ls -la "${IMAGES_DIR}/"
            echo "Looking for any .img files:"
            find output/ -name "*.img" 2>/dev/null || echo "(none)"
            exit 1
          fi

          FINAL_NAME="LushanPi-K230_Debian13_bigcore_${VERSION}_${DATE}.img"
          cp "${IMG_FILE}" "${IMAGES_DIR}/${FINAL_NAME}"

          gzip -k -f "${IMAGES_DIR}/${FINAL_NAME}"
          mv "${IMAGES_DIR}/${FINAL_NAME}.gz" "output/${FINAL_NAME}.img.gz"
          cp "${IMAGES_DIR}/${FINAL_NAME}" "output/${FINAL_NAME}.img"

          cd output
          sha256sum "${FINAL_NAME}.img" > "${FINAL_NAME}.img.sha256"
          sha256sum "${FINAL_NAME}.img.gz" > "${FINAL_NAME}.img.gz.sha256"
          md5sum "${FINAL_NAME}.img.gz" > "${FINAL_NAME}.img.gz.md5"

          echo ">>> Final artifacts:"
          ls -lh output/

      - name: Upload final image artifact
        uses: actions/upload-artifact@v4
        with:
          name: LushanPi-K230-Debian13-bigcore
          path: |
            output/*.img
            output/*.img.gz
            output/*.sha256
            output/*.md5
          retention-days: 30

  # ============================================================================
  # Job 3: Release (only on tag push or manual dispatch)
  # ============================================================================
  release:
    runs-on: ubuntu-24.04
    needs: [build-rootfs, build-sdk]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.img.gz" -exec cp {} release/ \;
          find artifacts -name "*.img" -exec cp {} release/ \;
          find artifacts -name "*.sha256" -exec cp {} release/ \;
          find artifacts -name "*.md5" -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: "LushanPi K230 Debian 13 (Big Core) ${{ inputs.image_version || github.ref_name }}"
          body: |
            ## 🐧 LushanPi K230 Debian 13 Image (Big Core)

            ### Features
            - Debian 13 (trixie) running on K230 **Big Core** (CPU1, 1.6GHz RISC-V C908 with RVV 1.0)
            - Full apt package management
            - Pre-configured for LushanPi K230 board
            - Serial console auto-login (root/root)
            - SSH enabled (root/root)
            - DHCP enabled for Ethernet
            - WiFi support (RTL8189)
            - GPIO tools pre-installed

            ### Flashing
            ```bash
            # Linux
            sudo dd if=LushanPi-K230_Debian13_bigcore_*.img of=/dev/sdX bs=1M oflag=sync

            # Windows: Use Balena Etcher or Rufus
            ```

            ### Login
            - **Serial**: 115200 8N1, root/root
            - **SSH**: root@<board-ip>, root/root

            ### Verify Checksum
            ```bash
            sha256sum -c *.img.sha256
            ```

            ---
            *Auto-built by GitHub Actions*
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
